<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Workflow SGA</title>
  <!-- Tailwind CSS per lo stile rapido -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icone Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PDF.js per la conversione nativa dei PDF in immagini -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .board-column { min-width: 280px; max-width: 280px; }
    * { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- SCHERMATA DI LOGIN -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="bg-indigo-600 w-12 h-12 rounded-xl mx-auto flex items-center justify-center text-white shadow-lg shadow-indigo-900/40">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-white">Workflow SGA</h2>
        <p class="text-xs text-slate-400">Inserisci la password di accesso per entrare nell'area di lavoro.</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
          <input type="password" id="loginPassword" required placeholder="Password di accesso..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="rememberMe" class="rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
          <label for="rememberMe" class="text-xs text-slate-300 cursor-pointer select-none">Ricordami su questo dispositivo</label>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20 text-sm">
          <i data-lucide="arrow-right" class="w-4 h-4"></i> Accedi al Programma
        </button>
      </form>
    </div>
  </div>

  <!-- TOP BAR -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center shrink-0 flex-wrap gap-3">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-900/20">
        <i data-lucide="layers" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-white">Workflow SGA</h1>
        <p id="cloudStatus" onclick="openModal('cloudModal')" class="text-xs flex items-center gap-1 cursor-pointer transition-colors mt-0.5" title="Clicca per impostazioni Cloud">
          <i data-lucide="hard-drive" class="w-3 h-3 text-slate-400"></i> <span class="text-slate-400 hover:text-slate-200">Modalità Locale (Clicca per configurare)</span>
        </p>
      </div>
    </div>
    
    <div class="flex space-x-2 items-center">
      <button onclick="logoutApp()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 active:scale-95 transition-transform" title="Esci dall'account">
        <i data-lucide="log-out" class="w-4 h-4"></i> Esci
      </button>
      <button onclick="exportBackup()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 active:scale-95 transition-transform" title="Scarica un file di sicurezza">
        <i data-lucide="download-cloud" class="w-4 h-4"></i> Backup
      </button>
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 cursor-pointer active:scale-95 transition-transform" title="Carica un file di backup">
        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Ripristina
        <input type="file" accept=".json" class="hidden" onchange="importBackup(event)">
      </label>
      
      <div class="w-px h-6 bg-slate-700 mx-1"></div>
      
      <button onclick="openModal('addCardModal')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 active:scale-95 transition-transform shadow-lg shadow-indigo-900/20">
        <i data-lucide="plus" class="w-4 h-4"></i> Nuova Commessa
      </button>
    </div>
  </header>

  <!-- WORKSPACE A SCORRIMENTO ORIZZONTALE -->
  <main id="board" class="flex-1 overflow-x-auto overflow-y-hidden flex gap-4 p-4 items-start select-none">
    <!-- Colonne generate via JS -->
  </main>

  <!-- MODAL: DETTAGLIO SCHEDA -->
  <div id="detailModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-850">
        <div class="flex items-center gap-2">
          <span id="detailBadge" class="px-2 py-0.5 rounded text-xs font-bold text-white uppercase"></span>
          <h2 class="text-lg font-bold">Dettaglio Commessa</h2>
        </div>
        <button onclick="closeModal('detailModal')" class="text-slate-400 hover:text-slate-200 bg-slate-800 rounded-full p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="p-5 overflow-y-auto space-y-5 flex-1 text-sm">
        <!-- Modifica Anagrafica -->
        <div class="space-y-3 bg-slate-950 p-3.5 rounded-lg border border-slate-800">
          <div>
            <label class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider block mb-1">Cliente / Titolo Progetto</label>
            <input type="text" id="editTitle" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-slate-100 font-semibold text-base focus:outline-none focus:border-indigo-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider block mb-1">Referente / Contatto</label>
              <input type="text" id="editClient" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider block mb-1">Tipo Lavorazione</label>
              <select id="editJobType" onchange="checkEditCustomJobType(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                <option value="Stampa Digitale / Banner">Stampa Digitale / Banner</option>
                <option value="Abbigliamento / Ricamo">Abbigliamento / Ricamo</option>
                <option value="Insegne & Vetrofanie">Insegne & Vetrofanie</option>
                <option value="Etichette & Adesivi">Etichette & Adesivi</option>
                <option value="Grafica / Progettazione">Grafica / Progettazione</option>
                <option value="Altro">Altro</option>
                <option value="custom">Personalizza...</option>
              </select>
              <input type="text" id="editCustomJobType" placeholder="Specifica nuovo tipo..." class="hidden mt-2 w-full bg-slate-900 border border-indigo-500 rounded px-3 py-1.5 text-slate-200 text-xs focus:outline-none">
            </div>
          </div>
          <button onclick="saveCardEdits()" class="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1.5 transition-colors">
            <i data-lucide="save" class="w-3.5 h-3.5"></i> Aggiorna Anagrafica e Tipo Lavoro
          </button>
        </div>

        <!-- Modifica Note -->
        <div class="space-y-2 bg-slate-950 p-3.5 rounded-lg border border-slate-800">
          <label class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider block">Dettagli & Note</label>
          <textarea id="editNotes" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
          <button onclick="saveNotesEdits()" class="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1.5 transition-colors">
            <i data-lucide="save" class="w-3.5 h-3.5"></i> Aggiorna Note e Specifiche
          </button>
        </div>

        <!-- Foto & Documenti PDF -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-xs text-slate-400 font-semibold uppercase tracking-wider block">Foto & Documenti PDF</label>
            <label class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1.5 text-slate-200">
              <i data-lucide="paperclip" class="w-3.5 h-3.5"></i> Allega Foto / PDF
              <input type="file" id="photoInput" accept="image/*,.pdf" multiple class="hidden" onchange="handleDocumentUpload(event)">
            </label>
          </div>
          <div id="attachmentsContainer" class="grid grid-cols-4 gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800 max-h-36 overflow-y-auto">
            <!-- Miniature -->
          </div>
        </div>

        <!-- STORYBOARD -->
        <div>
          <label class="text-xs text-slate-400 font-semibold uppercase tracking-wider block mb-3">Storyboard Lavorazione</label>
          <div id="storyboardTimeline" class="relative pl-6 space-y-3 before:absolute before:left-2 before:top-1.5 before:bottom-1.5 before:w-0.5 before:bg-slate-800">
            <!-- Step -->
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="p-4 border-t border-slate-800 bg-slate-950 flex justify-between gap-3">
        <button onclick="deleteCurrentCard()" class="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-900/50 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 active:scale-95 transition-all text-xs">
          <i data-lucide="trash-2" class="w-4 h-4"></i> Elimina
        </button>
        <div class="flex gap-2">
          <button onclick="printCard()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 active:scale-95 transition-all text-xs">
            <i data-lucide="printer" class="w-4 h-4"></i> Stampa Scheda
          </button>
          <button onclick="closeModal('detailModal')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg font-semibold active:scale-95 transition-all text-xs shadow-lg shadow-indigo-900/20">
            Chiudi Scheda
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: NUOVA COMMESSA -->
  <div id="addCardModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-100">Nuova Commessa SGA</h3>
        <button onclick="closeModal('addCardModal')" class="text-slate-400 hover:text-slate-200 bg-slate-800 rounded-full p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form id="newCardForm" class="space-y-4 text-sm" onsubmit="createNewCard(event)">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Cliente / Titolo Progetto</label>
          <input type="text" id="formTitle" required placeholder="Es. Rossi S.r.l. - Striscione PVC" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Referente / Contatto</label>
            <input type="text" id="formClient" placeholder="Es. Marco Rossi" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tipo Lavorazione</label>
            <select id="formJobType" onchange="checkNewCustomJobType(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="Stampa Digitale / Banner">Stampa Digitale / Banner</option>
              <option value="Abbigliamento / Ricamo">Abbigliamento / Ricamo</option>
              <option value="Insegne & Vetrofanie">Insegne & Vetrofanie</option>
              <option value="Etichette & Adesivi">Etichette & Adesivi</option>
              <option value="Grafica / Progettazione">Grafica / Progettazione</option>
              <option value="Altro">Altro</option>
              <option value="custom">Personalizza...</option>
            </select>
            <input type="text" id="formCustomJobType" placeholder="Specifica nuovo tipo..." class="hidden mt-2 w-full bg-slate-950 border border-indigo-500 rounded-lg px-3 py-2 text-slate-200 text-xs focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Note & Specifiche</label>
          <textarea id="formNotes" placeholder="Dettagli lavorazione, misure, finiture, capi da ordinare..." rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20">
          <i data-lucide="plus" class="w-4 h-4"></i> Inserisci in Workflow
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL: CONFIGURAZIONE CLOUD FIREBASE -->
  <div id="cloudModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-100 flex items-center gap-2">
          <i data-lucide="cloud" class="w-5 h-5 text-indigo-400"></i> Configura Cloud
        </h3>
        <button onclick="closeModal('cloudModal')" class="text-slate-400 hover:text-slate-200 bg-slate-800 rounded-full p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="text-xs text-slate-400 mb-4">
        Inserisci qui i dati del tuo progetto Firebase per sincronizzare in tempo reale i dispositivi.
      </p>
      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">API Key</label>
          <input type="text" id="cfgApiKey" placeholder="Es. AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono text-xs">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Project ID</label>
          <input type="text" id="cfgProjectId" placeholder="Es. workflow-sga-123" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono text-xs">
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="saveFirebaseConfig()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20">
            <i data-lucide="check" class="w-4 h-4"></i> Salva e Connetti
          </button>
          <button onclick="resetFirebaseConfig()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 px-3 rounded-lg active:scale-[0.98] transition-transform text-xs" title="Disconnetti e torna a salvare in locale">
            Scollega
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: VISUALIZZATORE IMMAGINI / PDF -->
  <div id="galleryModal" class="hidden fixed inset-0 bg-black/95 z-[60] flex flex-col items-center justify-center select-none">
    <div class="absolute top-0 w-full p-4 flex justify-between items-center z-10 bg-gradient-to-b from-black/80 to-transparent">
      <div id="galleryCounter" class="text-white font-mono text-sm font-bold bg-black/50 px-3 py-1 rounded-full"></div>
      <div class="flex gap-4 items-center">
        <button id="btnRotate" onclick="rotateGalleryImage()" class="text-white p-2 bg-slate-800 hover:bg-slate-700 rounded-full transition-colors" title="Ruota immagine">
          <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        </button>
        <button onclick="closeGallery()" class="text-white p-2 bg-slate-800 hover:bg-slate-700 rounded-full transition-colors" title="Chiudi">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    <div class="relative w-full h-full flex items-center justify-center p-4">
      <!-- Immagine centrata, ora con sfondo nativamente bianco per i PDF -->
      <img id="galleryImage" src="" class="max-w-full max-h-[90vh] object-contain transition-transform duration-300 bg-white">
      
      <button onclick="prevGalleryImage()" class="absolute left-4 top-1/2 -translate-y-1/2 text-white p-3 bg-slate-800/80 hover:bg-slate-700 rounded-full transition-colors" id="btnPrevGallery">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>
      <button onclick="nextGalleryImage()" class="absolute right-4 top-1/2 -translate-y-1/2 text-white p-3 bg-slate-800/80 hover:bg-slate-700 rounded-full transition-colors" id="btnNextGallery">
        <i data-lucide="chevron-right" class="w-6 h-6"></i>
      </button>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    // ==========================================
    // CONFIGURAZIONE PASSWORD CONDIVISA
    // ==========================================
    const SHARED_PASSWORD = "sga2026";

    function checkAuth() {
      const isAuth = localStorage.getItem('workflow_sga_auth');
      const loginScreen = document.getElementById('loginScreen');
      if (isAuth === 'true') {
        loginScreen.classList.add('hidden');
        init();
      } else {
        loginScreen.classList.remove('hidden');
        lucide.createIcons();
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const pwInput = document.getElementById('loginPassword').value.trim();
      const remember = document.getElementById('rememberMe').checked;

      if (pwInput === SHARED_PASSWORD) {
        if (remember) {
          localStorage.setItem('workflow_sga_auth', 'true');
        }
        document.getElementById('loginScreen').classList.add('hidden');
        init();
      } else {
        alert("Password errata. Riprova.");
        document.getElementById('loginPassword').value = '';
      }
    }

    function logoutApp() {
      if (confirm("Vuoi uscire dall'area di lavoro?")) {
        localStorage.removeItem('workflow_sga_auth');
        location.reload();
      }
    }

    const COLUMNS_CONFIG = [
      { id: "prev-da-fare", label: "Prev. da fare", color: "bg-orange-600/20 border-orange-500/50 text-orange-400", border: "border-l-4 border-l-orange-500" },
      { id: "prev-inviato", label: "Prev. inviato", color: "bg-amber-600/20 border-amber-500/50 text-amber-400", border: "border-l-4 border-l-amber-500" },
      { id: "accettato-mod", label: "Accettato/Modifica", color: "bg-yellow-600/20 border-yellow-500/50 text-yellow-300", border: "border-l-4 border-l-yellow-500" },
      { id: "da-ordinare", label: "Da ordinare", color: "bg-rose-600/20 border-rose-500/50 text-rose-400", border: "border-l-4 border-l-rose-500" },
      { id: "ordinato", label: "Ordinato", color: "bg-pink-600/20 border-pink-500/50 text-pink-400", border: "border-l-4 border-l-pink-500" },
      { id: "in-arrivo", label: "In arrivo", color: "bg-purple-600/20 border-purple-500/50 text-purple-400", border: "border-l-4 border-l-purple-500" },
      { id: "magazzino", label: "In magazzino", color: "bg-fuchsia-600/20 border-fuchsia-500/50 text-fuchsia-400", border: "border-l-4 border-l-fuchsia-500" },
      { id: "in-lavorazione", label: "In lavorazione", color: "bg-cyan-600/20 border-cyan-500/50 text-cyan-400", border: "border-l-4 border-l-cyan-500" },
      { id: "lavorato", label: "Lavorato", color: "bg-emerald-600/20 border-emerald-500/50 text-emerald-400", border: "border-l-4 border-l-emerald-500" },
      { id: "consegnato", label: "Consegnato", color: "bg-teal-600/20 border-teal-500/50 text-teal-400", border: "border-l-4 border-l-teal-500" },
      { id: "fatturato", label: "Fatturato", color: "bg-blue-600/20 border-blue-500/50 text-blue-400", border: "border-l-4 border-l-blue-500" }
    ];

    let state = { cards: [] };
    let activeCardId = null;
    let currentGalleryIndex = 0;
    let db = null; 

    function initFirebase() {
      const cfgStr = localStorage.getItem('workflow_sga_firebase_config');
      if (!cfgStr) {
        updateCloudStatus(false);
        return;
      }
      try {
        const config = JSON.parse(cfgStr);
        if (config.apiKey && config.projectId) {
          if (!firebase.apps.length) {
            firebase.initializeApp({
              apiKey: config.apiKey,
              authDomain: `${config.projectId}.firebaseapp.com`,
              projectId: config.projectId,
              storageBucket: `${config.projectId}.appspot.com`
            });
          }
          db = firebase.firestore();
          updateCloudStatus(true);
          listenToCloudUpdates();
        } else {
          updateCloudStatus(false);
        }
      } catch (e) {
        updateCloudStatus(false);
      }
    }

    function updateCloudStatus(isOnline) {
      const statusEl = document.getElementById('cloudStatus');
      if (isOnline) {
        statusEl.innerHTML = `<i data-lucide="wifi" class="w-3 h-3 text-emerald-500"></i> <span class="text-emerald-400 font-semibold hover:text-emerald-300 transition-colors">Cloud Attivo (Sincronizzato)</span>`;
      } else {
        statusEl.innerHTML = `<i data-lucide="hard-drive" class="w-3 h-3 text-slate-400"></i> <span class="text-slate-400 hover:text-slate-200 transition-colors">Modalità Locale (Clicca per configurare)</span>`;
      }
      lucide.createIcons();
    }

    function saveFirebaseConfig() {
      const apiKey = document.getElementById('cfgApiKey').value.trim();
      const projectId = document.getElementById('cfgProjectId').value.trim();
      if (!apiKey || !projectId) return alert("Inserisci sia l'API Key che il Project ID.");
      localStorage.setItem('workflow_sga_firebase_config', JSON.stringify({ apiKey, projectId }));
      closeModal('cloudModal');
      location.reload(); 
    }

    function resetFirebaseConfig() {
      if (confirm("Vuoi disconnettere il Cloud?")) {
        localStorage.removeItem('workflow_sga_firebase_config');
        closeModal('cloudModal');
        location.reload();
      }
    }

    function listenToCloudUpdates() {
      if (!db) return;
      db.collection('workflow_sga_cards').onSnapshot((snapshot) => {
        if (snapshot.empty && state.cards.length > 0) {
          state.cards.forEach(card => syncCardToCloud(card));
          return;
        }

        snapshot.docChanges().forEach((change) => {
          const docData = change.doc.data();
          if (change.type === "added" || change.type === "modified") {
            const existingIndex = state.cards.findIndex(c => c.id === docData.id);
            if (existingIndex >= 0) {
              state.cards[existingIndex] = sanitizeCard(docData);
            } else {
              state.cards.push(sanitizeCard(docData));
            }
          }
          if (change.type === "removed") {
            state.cards = state.cards.filter(c => c.id !== docData.id);
          }
        });
        
        state.cards.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        saveLocal(); 
        
        if (activeCardId) {
          const activeCard = state.cards.find(c => c.id === activeCardId);
          if (activeCard) renderAttachments(activeCard);
          else closeModal('detailModal');
        }
      }, (err) => {
        console.error("Errore sincro cloud:", err);
      });
    }

    function syncCardToCloud(card) {
      if (!db || !card) return;
      db.collection('workflow_sga_cards').doc(card.id).set(card).catch(err => {
         console.error("Errore Cloud:", err);
      });
    }

    function syncDeleteToCloud(cardId) {
      if (!db || !cardId) return;
      db.collection('workflow_sga_cards').doc(cardId).delete().catch(e => console.error(e));
    }

    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width; let height = img.height;
            if (width > maxWidth || height > maxHeight) {
              if (width / height > maxWidth / maxHeight) {
                height = Math.round((height * maxWidth) / width); width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height); height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject; img.src = e.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    }
